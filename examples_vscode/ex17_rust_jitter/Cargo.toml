[package]
name = "ex17-rust-jitter"
version = "0.1.0"
edition = "2024"
description = "Periodic job in Rust on the Raspberry Pi Pico (Wokwi): period, jitter, heap"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embedded-alloc = "0.6"        # a heap for Vec/String (DIP switch 1)
embedded-hal = "1.0"
panic-halt = "1.0.0"
rp-pico = "0.9.0"

[profile.release]
debug = false        # small ELF: Wokwi loads it quickly
