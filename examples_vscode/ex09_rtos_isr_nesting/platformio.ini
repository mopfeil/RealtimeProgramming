; Build for Wokwi for VS Code (see ../README.md).
; Copy of examples/ex09_rtos_isr_nesting: update src/sketch.ino and diagram.json with ../sync.sh.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
; -Og: the debugger shows locals, arguments and the FreeRTOS TCBs
build_type = debug
; patched FreeRTOS from lib/FreeRTOS (no upload to wokwi.com needed)
lib_deps = symlink://../../lib/FreeRTOS
