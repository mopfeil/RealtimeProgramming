; Build for Wokwi for VS Code (see ../README.md).
; Copy of examples/ex15_c_jitter: update src/sketch.ino and diagram.json with ../sync.sh.
; Raspberry Pi Pico (RP2040) with the arduino-pico core (Earle Philhower).
; The official "raspberrypi" platform does not have this core, so the
; community platform below is used (first build downloads it, a few minutes).
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
